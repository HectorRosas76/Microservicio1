<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservas</title>
    <link rel="shortcut icon" href="images/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/cre_hist.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/msg.css">
  </head>
  <body>
  <nav class="menu">
    <div class="menu-item logo">
      <a href="index.html">
        <img src="images/logo.png" alt="Logo">
      </a>
    </div>
    <div class="menu-item">
      <a href="vehiculos.html">
        Vehículos
      </a>
    </div>
    <div class="menu-item">
      <a href="clientes.html">
        Clientes
      </a>
    </div>
    <div class="menu-item">
      <a href="reservas.html">
        Reservas
      </a>
    </div>
    <div class="menu-item">
      <a href="disponibilidad.html">
        Disponibilidad
      </a>
    </div>
    <div class="menu-item">
      <a href="historial.html">
        Historial
      </a>
    </div>
  </nav>

    <div class="page-container">
      <section class="header-section">
        <h1>Reservas</h1>
        <button id="registro-btn" class="btn btn-primary">+ Registrar Reserva</button>
      </section>

      <section class="list-controls">
        <h2>Buscar reserva</h2>
        <form name="search-form" class="search-form">
          <input type="text" name="search" placeholder="Buscar por cliente, vehículo, fecha o estado..." />
          <button type="submit" class="btn btn-primary">Buscar</button>
        </form>
      </section>

      <section class="grid-panel">
        <h2>Lista de Reservas</h2>
        <div id="reservas-grid" class="grid-wrapper">
          <div class="grid-row cols-7 grid-head">
          <div class="grid-cell">Código</div>
          <div class="grid-cell">Cliente</div>
          <div class="grid-cell">Vehículo</div>
          <div class="grid-cell">Fecha Inicio</div>
          <div class="grid-cell">Fecha Fin</div>
          <div class="grid-cell">Estado</div>
          <div class="grid-cell">Acciones</div>
          </div>
        </div>
      </section>
    </div>

    <div id="reserva-form-content" class="form-content close">
      <form name="reserva-form">
        <h3 id="form-title">Registrar</h3>
        <p class="form-sub">Elige el cliente, el vehículo y el periodo del alquiler.</p>
        <div class="field">
          <label for="cliente_id">Cliente</label>
          <select name="cliente_id" id="cliente_id" required>
            <option value="">Seleccionar</option>
          </select>
        </div>
        <div class="field">
          <label for="vehiculo_id">Vehículo</label>
          <select name="vehiculo_id" id="vehiculo_id" required>
            <option value="">Seleccionar</option>
          </select>
        </div>
        <div class="field">
          <label for="fecha_inicio">Fecha de inicio</label>
          <input type="date" name="fecha_inicio" id="fecha_inicio" required />
        </div>
        <div class="field">
          <label for="fecha_fin">Fecha de fin</label>
          <input type="date" name="fecha_fin" id="fecha_fin" required />
        </div>
        <div class="field" id="campo-estado">
          <label for="estado">Estado</label>
          <select name="estado" id="estado" required>
            <option value="activa">Activa</option>
            <option value="completada">Completada</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </div>
        <div class="btns">
          <button type="reset" class="btn btn-ghost">Cancelar</button>
          <button type="submit" class="btn-submit">Guardar</button>
        </div>
      </form>
    </div>

    <div id="confirm-modal" class="modal close">
      <div class="content">
        <h4>¿Desea borrar el registro?</h4>
        <div>
          <button id="cancelar-modal-btn" class="btn btn-ghost">Cancelar</button>
          <button id="confirmar-modal-btn" class="btn btn-delete">Borrar</button>
        </div>
      </div>
    </div>

    <div id="msg-content" class="msg hidden">
      <p></p>
    </div>

    <script src="js/components/base_components.js"></script>
    <script src="js/components/reservas_components.js"></script>
    <script src="js/services/base_services.js"></script>
    <script src="js/services/clientes_services.js"></script>
    <script src="js/services/vehiculos_services.js"></script>
    <script src="js/services/reservas_services.js"></script>
    <script src="js/reservas.js"></script>
  </body>
</html>
